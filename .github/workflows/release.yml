name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on any tag matching 'v*', e.g., v0.1, v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating a release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
